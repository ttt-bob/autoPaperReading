<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="搜索和浏览 AutoPaperReading 收录的计算机视觉论文">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#09110f" media="(prefers-color-scheme: dark)">
  <title>AutoPaperReading · 论文搜索</title>
  <link rel="stylesheet" href="landing.css?v=20260901-2">
</head>
<body>
  <div class="landing-effect" id="landingEffect" aria-hidden="true"></div>
  <main class="landing-main">
    <section class="search-home" aria-labelledby="site-title">
      <div class="search-home__intro">
        <p class="search-home__eyebrow">COMPUTER VISION PAPER LIBRARY</p>
        <h1 id="site-title"><span>Auto</span> Paper Reading</h1>
        <p>搜索论文标题、作者、研究方向或摘要内容</p>
      </div>

      <form class="paper-search" id="paperSearchForm" role="search">
        <label class="paper-search__box" for="paperSearchInput">
          <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"></circle>
            <path d="m21 21-4.35-4.35"></path>
          </svg>
          <input id="paperSearchInput" type="search" autocomplete="off" placeholder="搜索论文、arXiv ID 或论文网址" autofocus>
          <kbd>Enter</kbd>
        </label>
      </form>

      <nav class="branch-links" aria-label="论文页面入口">
        <a href="papers.html">
          <svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
            <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2Z"></path>
          </svg>
          <span>论文库</span>
        </a>
        <a href="video-search.html">
          <svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polygon points="23 7 16 12 23 17 23 7"></polygon>
            <rect x="1" y="5" width="15" height="14" rx="2"></rect>
          </svg>
          <span>Video Search</span>
        </a>
        <a href="gui-taxonomy.html">
          <svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect>
            <rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect>
          </svg>
          <span>GUI 分支</span>
        </a>
        <a href="submit-paper.html">
          <svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 5v14M5 12h14"></path>
          </svg>
          <span>添加论文</span>
        </a>
      </nav>

      <div class="search-status" id="searchStatus" aria-live="polite"></div>
      <div class="search-add-prompt" id="searchAddPrompt"></div>
      <div class="search-results" id="searchResults"></div>
    </section>
  </main>

  <footer class="landing-footer">
    <span>颜色自动跟随系统</span>
  </footer>
  <script src="vendor/canvas-nest.umd.js?v=2.0.4-apr2"></script>
  <script src="landing.js?v=20260901-5"></script>
</body>
</html>
